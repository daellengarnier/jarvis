const BEATS=[0.209, 0.813, 1.416, 2.043, 2.647, 3.251, 3.855, 4.458, 5.062, 5.666, 6.269, 6.873, 7.477, 8.057, 8.661, 9.265, 9.868, 10.472, 11.076, 11.656, 12.26, 12.864, 13.468, 14.071, 14.652, 15.256, 15.859, 16.463, 17.067, 17.67, 18.274, 18.878, 19.482, 20.062, 20.666, 21.269, 21.873, 22.477, 23.081, 23.684, 24.288, 24.892, 25.496, 26.099, 26.703, 27.307, 27.91, 28.514, 29.118, 29.722, 30.325, 30.929, 31.533, 32.136, 32.74, 33.344, 33.948, 34.551, 35.155, 35.759, 36.362, 36.966, 37.57, 38.174, 38.777, 39.381, 39.985, 40.588, 41.192, 41.796, 42.4, 43.003, 43.63, 44.234, 44.838, 45.441, 46.045, 46.649, 47.253, 47.856, 48.46, 49.064, 49.667, 50.271, 50.782, 51.293, 51.804, 52.407, 53.011, 53.615, 54.219, 54.822, 55.426, 56.03, 56.633, 57.237, 57.864, 58.445, 59.048, 59.652, 60.279, 60.883, 61.486, 62.09, 62.694, 63.298, 63.901, 64.505, 65.109, 65.712, 66.316, 66.92, 67.547, 68.151, 68.754, 69.358, 69.962, 70.565, 71.169, 71.773, 72.4, 73.004, 73.607, 74.211, 74.815, 75.418, 76.022, 76.626, 77.23, 77.857, 78.46, 79.064, 79.668, 80.271, 80.875, 81.479, 82.083, 82.709, 83.29, 83.917, 84.521, 85.124, 85.728, 86.332, 86.936, 87.539, 88.143, 88.77, 89.374, 89.977, 90.581, 91.185, 91.788, 92.415, 93.019, 93.623, 94.25, 94.854, 95.48, 96.084, 96.711, 97.315, 97.942, 98.545, 99.149, 99.776, 100.38, 100.984, 101.611, 102.214, 102.818, 103.445, 104.049, 104.676, 105.279, 105.883, 106.51, 107.114, 107.741, 108.344, 108.948, 109.575, 110.179, 110.782, 111.409, 112.013, 112.64, 113.244, 113.847, 114.474, 115.101, 115.705, 116.309];

/* ---------- math ---------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x,lerp=(a,b,t)=>a+(b-a)*t,inv=(a,b,x)=>clamp((x-a)/(b-a));
const E={
 outExpo:t=>t>=1?1:1-Math.pow(2,-10*t),inExpo:t=>t<=0?0:Math.pow(2,10*t-10),
 outCubic:t=>1-Math.pow(1-t,3),inCubic:t=>t*t*t,inOutCubic:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
 outBack:t=>{const a=1.7,b=a+1;return 1+b*Math.pow(t-1,3)+a*Math.pow(t-1,2)},
 outBounce:x=>{const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375},
 outElastic:t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI)/3)+1,
};
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const noise1=(x,s=0)=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i+s*57.31),hash(i+1+s*57.31),u)*2-1};
const fade=(t,a,d,b,d2)=>inv(a,a+d,t)*(b==null?1:1-inv(b,b+(d2??d),t));

/* ---------- timeline (snapped to the music) ---------- */
const TT={

];

/* ---------- text ---------- */
function F(ctx,fam,sz,o={}){ctx.font=`${o.it?'italic ':''}${o.w||400} ${sz}px "${fam}"`}
function TW(ctx,s,fam,sz,o={}){ctx.save();F(ctx,fam,sz,o);ctx.letterSpacing=(o.tr||0)+'px';const m=ctx.measureText(s).width;ctx.restore();return m}
function T(ctx,s,x,y,fam,sz,col,o={}){ctx.save();F(ctx,fam,sz,o);ctx.letterSpacing=(o.tr||0)+'px';ctx.textAlign=o.al||'center';ctx.textBaseline=o.bl||'alphabetic';
  ctx.globalAlpha*=(o.a??1);ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.restore()}
// letters drop in with a bounce, optionally fall out with gravity
function dropT(ctx,s,x,y,fam,sz,col,t,t0,o={}){
  if(t<t0)return;ctx.save();F(ctx,fam,sz,o);ctx.letterSpacing=(o.tr||0)+'px';ctx.textAlign='left';ctx.textBaseline='alphabetic';
  const tot=ctx.measureText(s).width,sx=o.al==='left'?x:o.al==='right'?x-tot:x-tot/2,ch=[...s];let pre='';
  for(let i=0;i<ch.length;i++){const cx=sx+ctx.measureText(pre).width,cw=ctx.measureText(ch[i]).width;pre+=ch[i];if(ch[i]===' ')continue;
    const st=o.st??.035,d=o.d??.55,u=inv(t0+i*st,t0+i*st+d,t);if(u<=0)continue;
    let dy=-(1-E.outBounce(u))*(o.h??500),rot=0,a=1;
    if(o.out!=null){const e=t-(o.out+i*(o.ost??.025));if(e>0){dy+=1900*e*e-260*e*hash(i*3.3);rot=(hash(i*7.1)-.5)*e*5;if(dy>1400)continue}}
    ctx.save();ctx.translate(cx+cw/2,y+dy);ctx.rotate(rot);ctx.fillStyle=typeof col==='function'?col(i):col;ctx.fillText(ch[i],-cw/2,0);ctx.restore()}
  ctx.restore()}
// letters pop (scale) in
function popT(ctx,s,x,y,fam,sz,col,t,t0,o={}){if(t<t0)return;const u=E.outBack(inv(t0,t0+(o.d??.35),t));ctx.save();ctx.translate(x,y);ctx.scale(u,u);T(ctx,s,0,0,fam,sz,col,o);ctx.restore()}
// typewriter
function typeT(ctx,s,x,y,sz,col,t,t0,cps=20,o={}){if(t<t0)return;const n=Math.min(s.length,Math.floor((t-t0)*cps));T(ctx,s.slice(0,n),x,y,'Elite',sz,col,{al:'left',...o})}

/* ---------- textures & patterns ---------- */
function makePaper(){const k=mk(),g=k.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);
  const layer=(w,h,amp,seed)=>{const s=mk(w,h),sg=s.getContext('2d'),id=sg.createImageData(w,h);let r=seed;for(let i=0;i<id.data.length;i+=4){r=(r*1103515245+12345)&0x7fffffff;const v=255-(r%1000)/1000*amp;id.data[i]=v;id.data[i+1]=v*.97;id.data[i+2]=v*.9;id.data[i+3]=255}sg.putImageData(id,0,0);return s};
  g.globalCompositeOperation='multiply';g.imageSmoothingEnabled=true;
  [[24,14,40,11],[96,54,26,23],[480,270,18,37],[1920,1080,22,51]].forEach(([w,h,a,s])=>g.drawImage(layer(w,h,a,s),0,0,W,H));
  g.globalCompositeOperation='multiply';g.strokeStyle='rgba(120,90,50,0.06)';g.lineWidth=1;
  for(let i=0;i<900;i++){const x=hash(i*1.3)*W,y=hash(i*2.7)*H,a=hash(i*3.9)*6.28,l=8+hash(i*5.1)*30;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a+1)*l*.5,y+Math.sin(a+1)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}
  // stains
  for(let i=0;i<7;i++){const x=hash(i*9.1)*W,y=hash(i*4.4)*H,r=80+hash(i*2.2)*260,gr=g.createRadialGradient(x,y,r*.6,x,y,r);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.85,'rgba(170,130,80,0.10)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,W,H)}
  return k}
let PAPERTEX,HALF,HALFR,GRAINS=[],VIG;
function initTex(){
  PAPERTEX=makePaper();
  const tile=(col,r,s=7)=>{const k=mk(s,s),g=k.getContext('2d');g.fillStyle=col;g.beginPath();g.arc(s/2,s/2,r,0,7);g.fill();return c.createPattern(k,'repeat')};
  HALF=tile('rgba(33,28,23,0.55)',1.5);HALFR=tile('rgba(80,10,5,0.45)',1.7);
  for(let gI=0;gI<6;gI++){const k=mk(640,360),g=k.getContext('2d'),id=g.createImageData(640,360);let s=gI*99991+7;for(let i=0;i<id.data.length;i+=4){s=(s*1103515245+12345)&0x7fffffff;const v=s%255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}g.putImageData(id,0,0);GRAINS.push(k)}
  VIG=mk();const vg=VIG.getContext('2d'),gr=vg.createRadialGradient(W/2,H/2,H*.38,W/2,H/2,H*1.0);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.75,'rgba(70,40,15,0.18)');gr.addColorStop(1,'rgba(40,20,5,0.62)');vg.fillStyle=gr;vg.fillRect(0,0,W,H);
}

/* ---------- shapes ---------- */
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,Math.max(0,Math.min(r,w/2,h/2)))}
function shadeRect(ctx,x,y,w,h,pat=HALF){ctx.save();ctx.fillStyle=pat;ctx.fillRect(x,y,w,h);ctx.restore()}
function person(ctx,x,y,h,col,item,wave=0){const u=h/10;ctx.save();ctx.fillStyle=col;
  ctx.beginPath();ctx.arc(x,y-h+1.25*u,1.25*u,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(x-1.9*u,y-h+3.0*u);ctx.lineTo(x+1.9*u,y-h+3.0*u);ctx.lineTo(x+1.5*u,y-3.9*u);ctx.lineTo(x-1.5*u,y-3.9*u);ctx.closePath();ctx.fill();
  ctx.fillRect(x-1.45*u,y-4.1*u,1.25*u,4.1*u);ctx.fillRect(x+.2*u,y-4.1*u,1.25*u,4.1*u);
  if(item==='cert'){ctx.fillStyle=LIGHT;ctx.strokeStyle=INK;ctx.lineWidth=Math.max(1,u*.25);ctx.fillRect(x+1.6*u,y-6.4*u-wave,2.4*u,1.6*u);ctx.strokeRect(x+1.6*u,y-6.4*u-wave,2.4*u,1.6*u)}
  if(item==='coin'){ctx.fillStyle=RED;ctx.beginPath();ctx.arc(x+2.6*u,y-5.6*u-wave,u*.95,0,7);ctx.fill()}
  ctx.restore()}
function stampBox(ctx,x,y,w,h,rot,col,draw,t,t0){ // rubber stamp lands at t0
  if(t<t0-.14)return;const s=t<t0?lerp(2.3,1,E.inCubic(inv(t0-.14,t0,t))):1,a=t<t0?inv(t0-.14,t0-.02,t):1;
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);ctx.globalAlpha*=a;ctx.strokeStyle=col;ctx.fillStyle=col;draw(ctx,w,h);
  // worn ink: knock out specks
  ctx.globalCompositeOperation='destination-out';for(let i=0;i<70;i++){const px=(hash(i*3.1+t0)-.5)*w,py=(hash(i*5.7+t0)-.5)*h,r=.6+hash(i*7.3+t0)*2.4;ctx.beginPath();ctx.arc(px,py,r,0,7);ctx.fill()}
  ctx.restore()}
function sunburst(ctx,x,y,R,rot,n,colA,colB){for(let i=0;i<n;i++){const a0=rot+i*Math.PI*2/n,a1=a0+Math.PI/n;ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,R,a0,a1);ctx.closePath();ctx.fillStyle=i%2?colA:colB;ctx.fill()}}
function crossShape(ctx,x,y,s,col){const u=s/20;ctx.fillStyle=col;ctx.fillRect(x-3*u,y-10*u,6*u,20*u);ctx.fillRect(x-10*u,y-3*u,20*u,6*u)}
function ornamentRule(ctx,x,y,w,p,col){if(p<=0)return;const hw=w/2*p;ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x-hw,y);ctx.lineTo(x-18,y);ctx.moveTo(x+18,y);ctx.lineTo(x+hw,y);ctx.stroke();ctx.beginPath();ctx.moveTo(x-hw,y-5);ctx.lineTo(x-40,y-5);ctx.moveTo(x+40,y-5);ctx.lineTo(x+hw,y-5);ctx.lineWidth=1;ctx.stroke();
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);ctx.fillRect(-6*p,-6*p,12*p,12*p);ctx.restore();ctx.restore()}
function coin(ctx,x,y,r){ctx.save();ctx.fillStyle=RED;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.strokeStyle=lite(.7);ctx.lineWidth=r*.12;ctx.beginPath();ctx.arc(x,y,r*.68,0,7);ctx.stroke();ctx.restore()}
function factory(ctx,x,y,w,h,col=INK){ctx.save();ctx.fillStyle=col;const n=3,tw=w/n;ctx.beginPath();ctx.moveTo(x-w/2,y);ctx.lineTo(x-w/2,y-h*.55);
  for(let i=0;i<n;i++){const x0=x-w/2+i*tw;ctx.lineTo(x0+tw,y-h*.8);ctx.lineTo(x0+tw,y-h*.55)}ctx.lineTo(x+w/2,y);ctx.closePath();ctx.fill();
  ctx.fillRect(x+w*.28,y-h,w*.11,h*.5);ctx.fillStyle=LIGHT;for(let i=0;i<4;i++)ctx.fillRect(x-w/2+w*.08+i*w*.23,y-h*.4,w*.12,h*.16);ctx.restore()}
function moneyBag(ctx,x,y,r){ctx.save();ctx.fillStyle=RED;ctx.beginPath();ctx.ellipse(x,y,r,r*1.05,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(x-r*.35,y-r*.95);ctx.lineTo(x+r*.35,y-r*.95);ctx.lineTo(x+r*.2,y-r*1.4);ctx.lineTo(x-r*.2,y-r*1.4);ctx.fill();T(ctx,'CHF',x,y+r*.3,'Oswald',r*.62,LIGHT,{w:700});ctx.restore()}

/* ---------- the stock ticker machine + tape (the red thread) ---------- */
const CPS=16,SEP='   ·   ';
let TAPE_STR='',TAPE_IDX=[],TAPE_PRE=[];
function initTape(){let s='';CAPS.forEach(([t0,txt],j)=>{const base=s.length+(j?SEP.length:0);s+=(j?SEP:'')+txt;TAPE_IDX.push({t0,base,len:txt.length,sepStart:base-(j?SEP.length:0)})});TAPE_STR=s;
  F(c,'Elite',100);c.letterSpacing='0px';TAPE_PRE=[0];let acc=0;for(const ch of s){acc+=c.measureText(ch).width/100;TAPE_PRE.push(acc)}}
function typedCount(t){let n=0;for(const k of TAPE_IDX){if(t<k.t0)break;n=k.base+Math.min(k.len,(t-k.t0)*CPS)}return n}
function preW(n){const i=Math.floor(n),f=n-i;return lerp(TAPE_PRE[Math.min(i,TAPE_PRE.length-1)],TAPE_PRE[Math.min(i+1,TAPE_PRE.length-1)],f)}
function machinePose(t){const m=E.inOutCubic(inv(13.8,16.2,t)),out=E.inCubic(inv(117.0,117.8,t));
  return {ex:lerp(1010,1790,m)+out*400,ey:lerp(560,985,m),s:lerp(1.25,.4,m),th:lerp(70,50,m)}}
function drawMachine(ctx,t,p){const s=p.s,x=p.ex+150*s,y=p.ey-40*s,n=typedCount(t),hit=Math.exp(-((n%1)*1/CPS)*60);
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle=INK;ctx.beginPath();ctx.moveTo(-95,110);ctx.lineTo(95,110);ctx.lineTo(125,190);ctx.lineTo(-125,190);ctx.closePath();ctx.fill();
  rr(ctx,-150,60,300,60,10);ctx.fill();rr(ctx,-170,186,340,22,6);ctx.fill();
  // glass dome
  ctx.strokeStyle=INK;ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(0,62,128,250,0,Math.PI,2*Math.PI);ctx.stroke();
  ctx.strokeStyle=lite(.85);ctx.lineWidth=7;ctx.beginPath();ctx.ellipse(0,62,100,220,0,Math.PI*1.18,Math.PI*1.36);ctx.stroke();
  ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,62,108,232,0,Math.PI*1.45,Math.PI*1.5);ctx.stroke();
  ctx.fillStyle=INK;rr(ctx,-28,-218,56,20,6);ctx.fill();ctx.beginPath();ctx.arc(0,-226,14,0,7);ctx.fill();
  // mechanism
  const rot=n*0.9;ctx.save();ctx.translate(-10,-10);ctx.rotate(rot);ctx.strokeStyle=INK;ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,46,0,7);ctx.stroke();
  for(let i=0;i<16;i++){ctx.save();ctx.rotate(i*Math.PI/8);ctx.fillStyle=INK;ctx.fillRect(-3,-56,6,12);ctx.restore()}ctx.beginPath();ctx.arc(0,0,8,0,7);ctx.fillStyle=RED;ctx.fill();ctx.restore();
  ctx.fillStyle=INK;ctx.beginPath();ctx.arc(70,-40,22,0,7);ctx.fill();ctx.fillStyle=LIGHT;ctx.beginPath();ctx.arc(70,-40,12,0,7);ctx.fill();
  ctx.save();ctx.translate(-80,20-hit*10);ctx.fillStyle=RED;ctx.fillRect(-6,-46,12,46);ctx.restore();

function draw(t,frame){
