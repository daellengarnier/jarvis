<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Börse für Oli</title>
<style>
html,body{margin:0;height:100%;background:#000;display:grid;place-items:center;overflow:hidden}
canvas{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;display:block}
#play{position:fixed;inset:0;display:grid;place-items:center;color:#f4f1ea;font:700 20px "JetBrains Mono",monospace;letter-spacing:.2em;cursor:pointer;background:rgba(0,0,0,.4)}
</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<script>
/* ================================================================
   BÖRSE FÜR OLI · 2:00 · 1920x1080 · deterministisch: draw(t)
   ================================================================ */
const W=1920,H=1080,DUR=120,BEAT=0.5;
const C={bg:'#07070a',ink:'#f4f1ea',dim:'rgba(244,241,234,0.6)',faint:'rgba(244,241,234,0.18)',
  red:'#ff2d3d',lime:'#c8ff2e',cyan:'#2ee6ff'};
const DISP='Inter Display',MONO='JetBrains Mono';

const out=document.getElementById('out'),o=out.getContext('2d');
const mk=()=>{const k=document.createElement('canvas');k.width=W;k.height=H;return k};
const buf=mk(),c=buf.getContext('2d');
const tmp=mk(),tc=tmp.getContext('2d');

/* ---------- math ---------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const inv=(a,b,x)=>clamp((x-a)/(b-a));
const E={
  lin:t=>t,
  outExpo:t=>t>=1?1:1-Math.pow(2,-10*t),
  inExpo:t=>t<=0?0:Math.pow(2,10*t-10),
  inOutExpo:t=>t<=0?0:t>=1?1:t<.5?Math.pow(2,20*t-10)/2:(2-Math.pow(2,-20*t+10))/2,
  outCubic:t=>1-Math.pow(1-t,3),
  inCubic:t=>t*t*t,
  inOutCubic:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  outBack:t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},
  outElastic:t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI)/3)+1,
};
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const noise1=(x,s=0)=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i+s*57.31),hash(i+1+s*57.31),u)*2-1};
const env=(t,a,d,b,d2)=>{const i=E.outExpo(inv(a,a+d,t));const q=b==null?0:E.inExpo(inv(b,b+(d2??d),t));return i*(1-q)};

/* ---------- timeline ---------- */
const SC=[
 {s:0,  e:8,  n:'INTRO',               g:'BÖRSE',     f:sIntro},
 {s:8,  e:22, n:'01 · DIE AKTIE',      g:'AKTIE',     f:sAktie},
 {s:22, e:40, n:'02 · DIE BÖRSE',      g:'MARKT',     f:sBoerse},
 {s:40, e:50, n:'03 · SCHWEIZ',        g:'SCHWEIZ',   f:sSchweiz},
 {s:50, e:60, n:'04 · BÖRSENGANG',     g:'IPO',       f:sIPO},
 {s:60, e:82, n:'05 · VORAUSSETZUNGEN',g:'CHECK',     f:sReq},
 {s:82, e:94, n:'06 · ABLAUF',         g:'ABLAUF',    f:sAblauf},
 {s:94, e:108,n:'07 · WIESO',          g:'WARUM',     f:sWieso},
 {s:108,e:115,n:'08 · DER HAKEN',      g:'ABER',      f:sHaken},
 {s:115,e:120,n:'FAZIT',               g:'OLI',       f:sOutro},
];
const BOUNDS=SC.slice(1).map(s=>s.s);
const REQ_T0=62, REQ_STEP=8/3;
const NODE_T=[84,85.9,87.8,89.7,91.6];
const WHY_T0=96, WHY_STEP=2.4;
const HAKEN_T=[109.6,111.0,112.4];
window.CUES={
  bounds:BOUNDS,
  ticks:[...[0,1,2,3,4,5].map(i=>REQ_T0+i*REQ_STEP),...NODE_T,...[0,1,2,3,4].map(i=>WHY_T0+i*WHY_STEP),...HAKEN_T],
  checks:[0,1,2,3,4,5].map(i=>78.5+i*0.3),
  pops:[0.35,0.65,3.6,8.3,16.2,50.1,115.1,115.55,116.0,116.45,117.5],
  whoosh:[12.2,16.0,27.4,33.0,42.0,55.4],
  coins:[REQ_T0+2*REQ_STEP+0.1],
  stamp:[REQ_T0+4*REQ_STEP+1.2],
  final:[91.6],
};

const kick=t=>(t<8||t>=117)?0:((t>=108&&t<115)?0.45:1)*Math.exp(-(t%BEAT)*9);
function impact(t){let s=0;for(const B of BOUNDS){const a=t-B;if(a>=0&&a<1.2)s+=Math.exp(-a*7)}return s}
function glitch(t){let s=0;for(const B of BOUNDS){const a=t-B;if(a>=-0.04&&a<0.4)s=Math.max(s,Math.exp(-Math.max(0,a)*9))}
  if(t>=108&&t<115){const l=t-108;s=Math.max(s,(hash(Math.floor(t*10))>.86?.35:0))}
  return s}

/* ---------- text ---------- */
function setFont(ctx,sz,w=900,fam=DISP){ctx.font=`${w} ${sz}px "${fam}"`}
function fit(ctx,s,maxW,sz,w=900,fam=DISP){setFont(ctx,sz,w,fam);ctx.letterSpacing=(fam===DISP?-0.035*sz:0)+'px';const m=ctx.measureText(s).width;ctx.letterSpacing='0px';return m>maxW?sz*maxW/m:sz}
// kinetic text: letters rise out of a mask, exit upward
function kt(ctx,s,x,y,sz,col,t,t0,op={}){
  const w=op.w??900,fam=op.fam??DISP,track=op.track??(fam===DISP?-0.035*sz:0.04*sz);
  const st=op.st??0.028,d=op.d??0.7;
  ctx.save();setFont(ctx,sz,w,fam);ctx.letterSpacing=track+'px';ctx.textBaseline='alphabetic';ctx.textAlign='left';
  const total=ctx.measureText(s).width;
  const sx=op.align==='left'?x:op.align==='right'?x-total:x-total/2;
  if(t<t0){ctx.restore();return {x:sx,w:total}}
  if(op.mask!==false){ctx.beginPath();ctx.rect(sx-sz*.6,y-sz*1.02,total+sz*1.2,sz*1.36);ctx.clip()}
  const chars=[...s];let pre='';
  for(let i=0;i<chars.length;i++){
    const ch=chars[i];const cx=sx+ctx.measureText(pre).width;pre+=ch;
    if(ch===' ')continue;
    const p=E.outExpo(inv(t0+i*st,t0+i*st+d,t));
    let q=0;if(op.out!=null)q=E.inExpo(inv(op.out+i*st*.6,op.out+i*st*.6+(op.od??.42),t));
    if(p<=0||q>=1)continue;
    const dy=(1-p)*sz*1.15-q*sz*1.2;
    ctx.fillStyle=typeof col==='function'?col(i,ch):col;
    ctx.globalAlpha=(op.a??1)*(op.mask===false?p*(1-q):1);
    ctx.fillText(ch,cx,y+dy);
  }
  ctx.restore();return {x:sx,w:total};
}
function tx(ctx,s,x,y,sz,col,op={}){
  ctx.save();const fam=op.fam??DISP;setFont(ctx,sz,op.w??900,fam);
  ctx.letterSpacing=(op.track??(fam===DISP?-0.03*sz:0.06*sz))+'px';
  ctx.textAlign=op.align??'center';ctx.textBaseline=op.base??'alphabetic';ctx.globalAlpha=op.a??1;ctx.fillStyle=col;
  ctx.fillText(s,x,y);const m=ctx.measureText(s).width;ctx.restore();return m}
const mono=(s,x,y,sz,col,t,t0,op={})=>kt(c,s,x,y,sz,col,t,t0,{fam:MONO,w:700,st:0.012,d:0.5,...op});

/* ---------- shapes ---------- */
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function ring(ctx,x,y,r,p,col,lw){if(p<=0)return;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.beginPath();ctx.arc(x,y,r,-Math.PI/2,-Math.PI/2+Math.PI*2*p);ctx.stroke();ctx.restore()}
function check(ctx,x,y,s,p,col){if(p<=0)return;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=s*.16;ctx.lineCap='round';ctx.lineJoin='round';
  const pts=[[-.38,.02],[-.1,.3],[.42,-.3]];const L1=Math.hypot(.28,.28),L2=Math.hypot(.52,.6),L=(L1+L2)*p;
  ctx.beginPath();ctx.moveTo(x+pts[0][0]*s,y+pts[0][1]*s);
  if(L<=L1){const f=L/L1;ctx.lineTo(x+lerp(pts[0][0],pts[1][0],f)*s,y+lerp(pts[0][1],pts[1][1],f)*s)}
  else{ctx.lineTo(x+pts[1][0]*s,y+pts[1][1]*s);const f=(L-L1)/L2;ctx.lineTo(x+lerp(pts[1][0],pts[2][0],f)*s,y+lerp(pts[1][1],pts[2][1],f)*s)}
  ctx.stroke();ctx.restore()}
function arrow(ctx,x0,y0,x1,y1,p,col,lw=8){if(p<=0)return;const x=lerp(x0,x1,p),y=lerp(y0,y1,p),a=Math.atan2(y1-y0,x1-x0);
  ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x,y);ctx.stroke();
  ctx.translate(x,y);ctx.rotate(a);ctx.beginPath();ctx.moveTo(lw*2.6,0);ctx.lineTo(-lw*1.2,-lw*2.2);ctx.lineTo(-lw*1.2,lw*2.2);ctx.closePath();ctx.fill();ctx.restore()}
function burst(ctx,x,y,t,t0,col,n=28,R=320,seed=1){const a=t-t0;if(a<0||a>1.1)return;ctx.save();ctx.fillStyle=col;
  for(let i=0;i<n;i++){const ang=hash(i*3.1+seed)*Math.PI*2,sp=R*(0.5+hash(i*7.7+seed)*.7),p=E.outExpo(a/1.1),r=(1-p)*(4+hash(i+seed*9)*10);
    ctx.globalAlpha=1-p;ctx.beginPath();ctx.arc(x+Math.cos(ang)*sp*p,y+Math.sin(ang)*sp*p,r,0,7);ctx.fill()}ctx.restore()}
function shock(ctx,x,y,t,t0,col,R=600,lw=6){const a=t-t0;if(a<0||a>.9)return;const p=E.outExpo(a/.9);ctx.save();ctx.globalAlpha=1-p;ctx.strokeStyle=col;ctx.lineWidth=lw*(1-p)+1;ctx.beginPath();ctx.arc(x,y,R*p,0,7);ctx.stroke();ctx.restore()}
function swissCross(ctx,x,y,size,rot,col){const u=size/20;ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=col;ctx.fillRect(-3*u,-10*u,6*u,20*u);ctx.fillRect(-10*u,-3*u,20*u,6*u);ctx.restore()}

/* ---------- background ---------- */
function bg(t,tint,base=C.bg,dot='244,241,234'){
  c.fillStyle=base;c.fillRect(0,0,W,H);
  if(tint){const g=c.createRadialGradient(W/2,H*.56,0,W/2,H*.56,W*.72);g.addColorStop(0,tint);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,W,H)}
  const sp=64,ox=(t*22)%sp,oy=(t*11)%sp,k=kick(t),s=2.4+k*1.6;
  c.fillStyle=`rgba(${dot},${0.075+0.06*k})`;
  for(let y=-sp;y<H+sp;y+=sp)for(let x=-sp;x<W+sp;x+=sp)c.fillRect(x+ox-s/2,y+oy-s/2,s,s);
}
function ghost(t,word,col='rgba(244,241,234,0.045)'){
  c.save();setFont(c,430,900);c.letterSpacing='-14px';c.strokeStyle=col;c.lineWidth=2.5;c.textBaseline='middle';
  const w=c.measureText(word+'  ').width;const off=-((t*70)%w);
  for(let x=off;x<W+w;x+=w)c.strokeText(word+'  ',x,H*.55);c.restore()}
function tickerRows(t,a){c.save();setFont(c,22,600,MONO);c.fillStyle=`rgba(244,241,234,${a})`;c.textBaseline='middle';
  for(let r=0;r<5;r++){let s='';for(let i=0;i<40;i++){const up=hash(i*13+r*101)>.42;s+=(up?'▲ ':'▼ ')+(hash(i*7+r*31)*4).toFixed(2)+'   '}
    const w=c.measureText(s).width;const dir=r%2?1:-1;let x=((t*(60+r*25)*dir)%w);if(x>0)x-=w;
    c.fillText(s,x,120+r*210);c.fillText(s,x+w,120+r*210)}c.restore()}

/* ================================================================ SCENES */
function sIntro(t){
  bg(t,'rgba(255,45,61,0.10)');tickerRows(t,0.07);ghost(t,'BÖRSE');
  // flash in
  kt(c,'HEY OLI.',W/2,640,330,(i)=>i>=4?C.red:C.ink,t,0.3,{st:0.07,d:.8,out:2.75});
  shock(c,W/2,540,t,0.65,C.red,900,10);
  mono('EIN 2-MINUTEN-CRASHKURS',W/2,760,26,C.dim,t,1.0,{out:2.6});
  kt(c,'Was ist eigentlich',W/2,410,100,C.ink,t,3.1,{w:800,out:7.5,od:.35});
  const qs=fit(c,'DIE BÖRSE?',1700,300);
  kt(c,'DIE BÖRSE?',W/2,720,qs,(i)=>i===9?C.lime:C.ink,t,3.55,{st:0.05,d:.9,out:7.55,od:.35});
  // implode ring before drop
  const pr=inv(6.0,7.9,t);if(pr>0&&pr<1){c.save();c.strokeStyle=C.red;c.globalAlpha=pr;c.lineWidth=3+pr*10;c.beginPath();c.arc(W/2,540,lerp(1100,10,E.inCubic(pr)),0,7);c.stroke();c.restore()}
}

function sAktie(t){
  const l=t-8;bg(t,'rgba(255,45,61,0.08)');ghost(t,'AKTIE');
  kt(c,'Das ist eine Firma.',W/2,210,104,C.ink,l,0.2,{out:3.7});
  kt(c,'Man teilt sie in Stücke.',W/2,210,104,C.ink,l,4.0,{out:7.7});
  kt(c,'1 Stück = 1 AKTIE.',W/2,210,112,(i)=>i>=10?C.lime:C.ink,l,8.0,{out:13.55});
  const N=10,S=500,ts=S/N,cx=W/2,cy=620;
  const sa=E.outBack(inv(0.25,1.15,l)),rot=(1-sa)*-0.5,k=kick(t);
  const m=E.inOutExpo(inv(8.0,9.1,l));
  const fadeAll=1-inv(13.4,13.9,l);
  const sel=[6,3];
  c.save();c.globalAlpha=fadeAll;
  for(let gy=0;gy<N;gy++)for(let gx=0;gx<N;gx++){
    const bx=(gx-N/2+.5)*ts,by=(gy-N/2+.5)*ts,dist=Math.hypot(bx,by)/(S*.71);
    const e=E.outExpo(inv(4.2+dist*.6,5.4+dist*.6,l));
    const j=hash(gx*17+gy*131);
    let x=cx+bx*(sa+e*.42),y=cy+by*(sa+e*.42),sz=ts*sa*(1-e*.22)+.6,r=rot+(j-.5)*e*.5*(1-inv(5.5,6.6,l));
    let a=1;
    const isSel=gx===sel[0]&&gy===sel[1];
    if(isSel){x=lerp(x,560,m);y=lerp(y,610,m);sz=lerp(sz,330,m);r=lerp(r,0,m)}
    else{x=lerp(x,cx+(x-cx)*.62+330,m);y=lerp(y,cy+(y-cy)*.62,m);sz*=lerp(1,.62,m);a=lerp(1,.32,m)}
    sz*=1+k*.04;
    c.save();c.translate(x,y);c.rotate(r);c.globalAlpha=a*fadeAll;c.fillStyle=isSel&&m>0?C.red:C.red;
    rr(c,-sz/2,-sz/2,sz,sz,Math.min(6,sz*.08));c.fill();c.restore();
  }
  c.restore();
  // label on whole block
  const la=sa*(1-inv(4.0,4.4,l));
  if(la>0){c.save();c.globalAlpha=la;tx(c,'SCHOGGI AG',cx,cy+30,86,C.ink);c.restore();
    mono('EINE ERFUNDENE FIRMA',cx,cy+330,24,C.dim,l,1.2,{out:3.8})}
  // counter
  if(l>5.0&&l<8.2){const n=Math.round(100*E.outExpo(inv(4.6,6.2,l)));mono(`${n} STÜCKE`,cx,cy+360,30,C.ink,l,5.0,{out:7.7})}
  // selected tile labels
  if(m>0.05){c.save();c.globalAlpha=E.outCubic(inv(8.6,9.3,l))*fadeAll;tx(c,'1',560,640,180,C.ink);tx(c,'AKTIE',560,720,52,C.ink,{fam:MONO,w:800});c.restore();
    mono('= 1/100 DER SCHOGGI AG',1290,880,26,C.dim,l,9.4,{out:13.4})}
  kt(c,'Wer eine Aktie hat, besitzt ein Stück der Firma.',W/2,975,54,(i)=>i>=28?C.lime:C.ink,l,10.3,{w:800,st:.012,out:13.4});
}

function sBoerse(t){
  const l=t-22;
  const tint=l<11?(l>5.5?'rgba(200,255,46,0.10)':'rgba(46,230,255,0.07)'):(l<15.2?'rgba(255,45,61,0.13)':'rgba(46,230,255,0.07)');
  bg(t,tint);ghost(t,'MARKT');
  // ---- A: market place
  kt(c,'Die BÖRSE ist',W/2,190,100,(i)=>i>=4&&i<9?C.cyan:C.ink,l,0.15,{out:5.0});
  kt(c,'ein Marktplatz für Aktien.',W/2,300,76,C.ink,l,0.55,{w:800,out:5.05});
  const A=env(l,0.4,1.0,5.0,.5);
  if(A>0){
    c.save();c.globalAlpha=A;
    const k=kick(t);
    // box
    c.save();c.translate(W/2,650);c.scale(.9+.1*A+k*.02,.9+.1*A+k*.02);
    rr(c,-200,-120,400,240,22);c.fillStyle='rgba(46,230,255,0.08)';c.fill();c.strokeStyle=C.cyan;c.lineWidth=5;c.stroke();
    tx(c,'BÖRSE',0,22,78,C.ink);c.restore();
    // crowds
    for(let i=0;i<22;i++){const ang=hash(i*3.3)*7,rad=Math.sqrt(hash(i*5.1))*140;
      const bob=Math.sin(t*4+i)*4;c.fillStyle=C.lime;c.beginPath();c.arc(330+Math.cos(ang)*rad,650+Math.sin(ang)*rad+bob,13,0,7);c.fill();
      c.fillStyle=C.red;c.beginPath();c.arc(1590+Math.cos(ang+1)*rad,650+Math.sin(ang+1)*rad-bob,13,0,7);c.fill()}
    mono('KÄUFER',330,460,30,C.lime,l,1.0,{out:4.9});
    mono('VERKÄUFER',1590,460,30,C.red,l,1.1,{out:4.9});
    mono('wollen Aktien',330,880,24,C.dim,l,1.4,{out:4.9});
    mono('wollen Geld',1590,880,24,C.dim,l,1.5,{out:4.9});
    // flows
    for(let k2=0;k2<12;k2++){const u=((l*.42+k2/12)%1);const fa=Math.sin(u*Math.PI);
      const x=lerp(1450,470,u),y=650-Math.sin(u*Math.PI)*170+(k2%3-1)*16;
      c.globalAlpha=A*fa;c.fillStyle=C.red;c.save();c.translate(x,y);c.rotate(u*3);c.fillRect(-14,-14,28,28);c.restore();
      const u2=((l*.42+k2/12+.04)%1),x2=lerp(470,1450,u2),y2=650+Math.sin(u2*Math.PI)*170;
      c.globalAlpha=A*Math.sin(u2*Math.PI);c.fillStyle=C.lime;c.beginPath();c.arc(x2,y2,14,0,7);c.fill()}
    c.globalAlpha=A;
    mono('AKTIEN →',W/2,420,22,C.red,l,1.8,{out:4.9});
    mono('← GELD',W/2,905,22,C.lime,l,1.9,{out:4.9});
    c.restore();
  }
  // ---- B/C: chart
  kt(c,'Mehr Käufer als Verkäufer:',W/2,170,64,C.ink,l,5.6,{w:800,out:10.7});
  kt(c,'PREIS STEIGT ↑',W/2,290,112,C.lime,l,5.95,{out:10.75});
  kt(c,'Mehr Verkäufer als Käufer:',W/2,170,64,C.ink,l,11.0,{w:800,out:15.0});
  kt(c,'PREIS FÄLLT ↓',W/2,290,112,C.red,l,11.3,{out:15.05});
  const P=env(l,5.4,.8,15.0,.45);
  if(P>0){
    const x0=240,x1=1680,yT=380,yB=940,pr=s=>{const b=s<5?40+28*E.inOutCubic(s/5):68-30*E.inOutCubic(clamp((s-5)/4));return b+noise1(s*3.1,4)*2.3+noise1(s*9.7,5)*.9};
    const X=s=>x0+s/9.4*(x1-x0),Y=v=>yB-(v-28)/50*(yB-yT);
    c.save();c.globalAlpha=P;
    // grid
    setFont(c,20,600,MONO);c.textAlign='right';
    for(let v=30;v<=75;v+=15){const y=Y(v);c.strokeStyle=C.faint;c.lineWidth=1;c.beginPath();c.moveTo(x0,y);c.lineTo(lerp(x0,x1,E.outExpo(inv(5.4,6.4,l))),y);c.stroke();c.fillStyle=C.dim;c.fillText('CHF '+v,x0-16,y+7)}
    const sNow=clamp(l-6,0,9.2);
    // volume bars
    for(let i=0;i<60;i++){const s=i*9.2/60;if(s>sNow)break;const h=20+hash(i*9.1)*70*(1+((s>3.5&&s<5.5)||s>6.5?1:0));
      c.fillStyle=s<5?'rgba(200,255,46,0.35)':'rgba(255,45,61,0.4)';c.fillRect(X(s)-7,yB-h,14,h)}
    // area + line

function sOutro(t){
  const l=t-115;bg(t,'rgba(200,255,46,0.07)');ghost(t,'OLI');
  const words=['FIRMA','AKTIEN','BÖRSE','WACHSTUM'],sz=76;

  const gap=112,tot=ws.reduce((a,b)=>a+b,0)+gap*3;let x=(W-tot)/2;
  words.forEach((w,i)=>{kt(c,w,x,570,sz,i===3?C.lime:C.ink,l,.1+i*.45,{align:'left',out:2.25});
    if(i<3){const p=E.outExpo(inv(.3+i*.45,.6+i*.45,l))*(1-inv(2.2,2.45,l));arrow(c,x+ws[i]+28,540,x+ws[i]+gap-28,540,p,C.red,6)}x+=ws[i]+gap});

/* ---------- HUD + transitions ---------- */
function hud(t){
  const a=inv(.5,1.2,t)*(1-inv(119.4,120,t));if(a<=0)return;
  const sc=SC.find(s=>t>=s.s&&t<s.e)||SC[SC.length-1];
  const red=sc.f===sSchweiz;const ink=red?'rgba(7,7,10,0.85)':'rgba(244,241,234,0.75)';
  c.save();c.globalAlpha=a;setFont(c,20,700,MONO);c.letterSpacing='3px';c.fillStyle=ink;c.textBaseline='middle';
  c.fillStyle=red?C.bg:C.red;c.fillRect(56,58,14,14);c.fillStyle=ink;c.textAlign='left';c.fillText('BÖRSE FÜR OLI',84,66);
  const mm=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  c.textAlign='right';c.fillText(`${mm(t)} / 02:00`,W-56,66);
  c.textAlign='left';c.fillText(sc.n,84,H-62);c.fillStyle=red?C.bg:C.red;c.fillRect(56,H-72,4,20);
  c.fillStyle=red?'rgba(7,7,10,0.25)':'rgba(244,241,234,0.15)';c.fillRect(W-296,H-63,240,3);c.fillStyle=red?C.bg:C.lime;c.fillRect(W-296,H-63,240*t/DUR,3);
  // crop marks
  c.strokeStyle=ink;c.lineWidth=2;const m=30,L=26;
  [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(([x,y,sx,sy])=>{c.beginPath();c.moveTo(x,y+L*sy);c.lineTo(x,y);c.lineTo(x+L*sx,y);c.stroke()});
  c.restore();
}
function wipe(ctx,t){
  BOUNDS.forEach((B,bi)=>{const a=t-B;if(a<-.34||a>.36)return;
    const n=8,bh=(H+500)/n;ctx.save();
    if(bi%2){ctx.translate(W,0);ctx.scale(-1,1)}
    ctx.translate(W/2,H/2);ctx.rotate(-.18);ctx.translate(-W/2,-H/2);
    for(let k=0;k<n;k++){const dl=k*.02;
      const pA=E.outCubic(inv(B-.32+dl,B-.05,t)),pB=E.inCubic(inv(B+.03+dl*.6,B+.34,t));
      const x0=-300+(W+600)*pB,x1=-300+(W+600)*pA;if(x1<=x0)continue;
      ctx.fillStyle=k%3===1?C.ink:(B===40&&k%3===2?C.bg:C.red);ctx.fillRect(x0,-250+k*bh,x1-x0,bh+1)}
    ctx.restore()});
}

/* ---------- post ---------- */
const grains=[];for(let g=0;g<6;g++){const k=document.createElement('canvas');k.width=640;k.height=360;const gx=k.getContext('2d'),id=gx.createImageData(640,360);
  let s=g*99991+7;for(let i=0;i<id.data.length;i+=4){s=(s*1103515245+12345)&0x7fffffff;const v=s%255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}gx.putImageData(id,0,0);grains.push(k)}
const vig=mk(),vg=vig.getContext('2d');{const g=vg.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*1.05);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.62)');vg.fillStyle=g;vg.fillRect(0,0,W,H)}

function draw(t,frame){
  const sc=SC.find(s=>t>=s.s&&t<s.e)||SC[SC.length-1];
  c.save();c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.letterSpacing='0px';sc.f(t);c.restore();
  hud(t);wipe(c,t);
  // compose
  const imp=impact(t),k=kick(t),g=glitch(t);
  o.save();o.fillStyle='#000';o.fillRect(0,0,W,H);
  const s=1.02+.008*k+.035*imp,dx=noise1(t*37,1)*16*imp,dy=noise1(t*41,2)*16*imp;
  o.translate(W/2+dx,H/2+dy);o.rotate(noise1(t*23,3)*.006*imp);o.scale(s,s);o.translate(-W/2,-H/2);
  o.drawImage(buf,0,0);
  if(g>.03){
    tc.globalCompositeOperation='copy';tc.drawImage(buf,0,0);tc.globalCompositeOperation='multiply';tc.fillStyle='#ff0000';tc.fillRect(0,0,W,H);
    o.globalCompositeOperation='lighter';o.globalAlpha=.55*g;o.drawImage(tmp,26*g,0);
    tc.globalCompositeOperation='copy';tc.drawImage(buf,0,0);tc.globalCompositeOperation='multiply';tc.fillStyle='#00ffff';tc.fillRect(0,0,W,H);
    o.globalAlpha=.4*g;o.drawImage(tmp,-26*g,0);o.globalCompositeOperation='source-over';o.globalAlpha=1;
    const f=Math.floor(t*30);
    for(let i=0;i<14;i++){if(hash(i*1.7+f*.31)>g+.15)continue;const y=hash(i+f*13.1)*H,h=10+hash(i*3.3+f)*110,off=(hash(i*7.7+f)*2-1)*220*g;o.drawImage(buf,0,y,W,h,off,y,W,h)}
  }
  o.restore();
  // flash
  for(const B of BOUNDS){const a=t-B;if(a>=0&&a<.25){o.fillStyle=`rgba(255,255,255,${.35*Math.exp(-a*18)})`;o.fillRect(0,0,W,H)}}
  o.drawImage(vig,0,0);
  o.save();o.globalCompositeOperation='overlay';o.globalAlpha=.11;o.imageSmoothingEnabled=false;o.drawImage(grains[(frame??Math.floor(t*30))%6],0,0,W,H);o.restore();
  // scanlines
  o.fillStyle='rgba(0,0,0,0.06)';for(let y=0;y<H;y+=4)o.fillRect(0,y,W,1);
  // fade in/out
  const fo=Math.max(1-inv(0,.25,t),inv(119.3,120,t));if(fo>0){o.fillStyle=`rgba(0,0,0,${fo})`;o.fillRect(0,0,W,H)}
}

/* ---------- API ---------- */
window.READY=(async()=>{await Promise.all([document.fonts.load(`900 100px "${DISP}"`),document.fonts.load(`800 100px "${DISP}"`),document.fonts.load(`700 100px "${DISP}"`),document.fonts.load(`600 100px "${DISP}"`),document.fonts.load(`700 40px "${MONO}"`),document.fonts.load(`800 40px "${MONO}"`),document.fonts.load(`600 40px "${MONO}"`)]);return true})();

}
