<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Börse für Oli</title>
<style>
html,body{margin:0;height:100%;background:#000;display:grid;place-items:center;overflow:hidden}
canvas{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;display:block}
#play{position:fixed;inset:0;display:grid;place-items:center;color:#f4f1ea;font:700 20px "JetBrains Mono",monospace;letter-spacing:.2em;cursor:pointer;background:rgba(0,0,0,.4)}
</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<script>
/* =====================================================================
   BÖRSE FÜR OLI · v2 · eine durchgehende Kamerafahrt durch eine Welt.
   Held: der Punkt aus dem "?" -> Firma -> Aktie -> Kurs -> Fahne -> Firma
   -> Börsengang -> Tore -> Handelstag -> zurück ins "?". draw(t) ist rein.
   ===================================================================== */
const W=1920,H=1080,DUR=120,BEAT=0.5;
const C={bg:'#07070a',ink:'#f4f1ea',dim:'rgba(244,241,234,0.6)',faint:'rgba(244,241,234,0.16)',
  red:'#ff2d3d',lime:'#c8ff2e',cyan:'#2ee6ff'};
const DISP='Inter Display',MONO='JetBrains Mono';
const out=document.getElementById('out'),o=out.getContext('2d');
const mk=()=>{const k=document.createElement('canvas');k.width=W;k.height=H;return k};
const buf=mk(),c=buf.getContext('2d');const tmp=mk(),tc=tmp.getContext('2d');

/* ---------- math ---------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t, inv=(a,b,x)=>clamp((x-a)/(b-a));
const E={
  outExpo:t=>t>=1?1:1-Math.pow(2,-10*t), inExpo:t=>t<=0?0:Math.pow(2,10*t-10),
  inOutExpo:t=>t<=0?0:t>=1?1:t<.5?Math.pow(2,20*t-10)/2:(2-Math.pow(2,-20*t+10))/2,
  outCubic:t=>1-Math.pow(1-t,3), inCubic:t=>t*t*t, inOutCubic:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  outBack:t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},
  outBounce:x=>{const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375},
};
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const noise1=(x,s=0)=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i+s*57.31),hash(i+1+s*57.31),u)*2-1};
const env=(t,a,d,b,d2)=>{const i=E.outExpo(inv(a,a+d,t));const q=b==null?0:E.inExpo(inv(b,b+(d2??d),t));return i*(1-q)};
const kick=t=>(t<8||t>=117)?0:((t>=108&&t<115)?0.45:1)*Math.exp(-(t%BEAT)*9);

/* ---------- world layout ---------- */
const F={x:0,y:800}, M={x:1900,y:800}, P={x:5600,y:800}, GY=P.y+110;
const STEP=8/3, Gx=i=>P.x+900+i*800, A=i=>62.4+i*STEP;
const RX=k=>11400+k*380, RT=k=>83.6+k*0.75, BB_X=13300, HT_X=15300;
const CH0=27.5,CHD=10, CX=s=>M.x+s*200;
const price=s=>(s<5.5?50+25*E.inOutCubic(s/5.5):75-33*E.inOutCubic(clamp((s-5.5)/4)))+noise1(s*3.1,4)*1.8+noise1(s*9.7,5)*.7;
const CY=v=>M.y-(v-50)*14;
const HEND={x:CX(CHD),y:CY(price(CHD))};
const HI=36; // Held-Aktie (Spalte 6, Zeile 3)
const WHY_T=i=>96+i*2.4, HAK_T=[109.6,111.0,112.4];
const ORDER=[...Array(100).keys()].filter(k=>k!==HI).sort((a,b)=>hash(a*9.13)-hash(b*9.13));
const FF=ORDER.slice(0,20), CHIP=ORDER.slice(20,34);
const FFi=new Map(FF.map((k,i)=>[k,i])), CHi=new Map(CHIP.map((k,i)=>[k,i]));

window.CUES={
  hits:[8.0,40.0,91.6,117.9],
  risers:[[4.0,8.0],[38.2,40.0],[89.8,91.6],[115.8,117.9]],
  whoosh:[5.7,14.2,17.9,26.8,47.4,53.4,59.6,77.9,81.3,90.0,93.8,108,115.0],
  ticks:[...[0,1,2,3,4,5].map(A),...[0,1,2,3].map(RT),...[0,1,2,3,4].map(WHY_T),...HAK_T],
  checks:[0,1,2,3,4,5].map(i=>78.6+i*0.2),
  pops:[0.35,0.65,3.6,...[0.3636,0.7273,0.9091,1].map(u=>5.6+1.5*u),49.9,54.0,79.2],
  coins:[A(2)+0.1,96.1],
  stamp:[A(4)+0.6,89.6],
  bars:[...Array(9).keys()].map(i=>87.4+i*0.22),
};

/* ---------- path of the company (t >= 40) ---------- */
const SEG=[];(()=>{let x=P.x;const add=(t0,t1,x1,arc=0)=>{SEG.push({t0,t1,x0:x,x1,arc});x=x1};
  add(61.4,62.4,Gx(0));for(let i=1;i<6;i++)add(A(i)-0.85,A(i),Gx(i));
  add(82.0,83.2,11100);for(let k=0;k<4;k++)add(RT(k)-0.5,RT(k),RX(k),170);
  add(86.3,87.2,BB_X);add(90.4,91.6,HT_X,460)})();
function heroPos(t){let x=P.x,y=P.y;
  for(const s of SEG){if(t>=s.t1){x=s.x1;continue}if(t>=s.t0){const u=inv(s.t0,s.t1,t);x=lerp(s.x0,s.x1,s.arc?u:E.inOutCubic(u));y-=Math.sin(u*Math.PI)*s.arc}break}
  if(t>=112.4&&t<115)y+=noise1(t*5,7)*60*env(t,112.4,.3,114.6,.4);
  return {x,y}}
function squash(t){let s=0;for(const g of SEG)if(g.arc&&t>=g.t1&&t<g.t1+.6)s=Math.exp(-(t-g.t1)*9)*Math.cos((t-g.t1)*20);return s}
const heroScale=t=>1+.18*E.outBack(inv(96.2,97.2,t));

/* ---------- tiles ---------- */
function tileW(k,t){
  const gx=k%10,gy=(k/10|0),j=hash(k*13.7),isH=k===HI;
  if(t<40){
    const ts=46,sm=inv(11.0,11.8,t),seam=sm*3,dist=Math.hypot(gx-4.5,gy-4.5)/6.4;
    const e=E.outExpo(inv(12.0+dist*.5,13.0+dist*.5,t));
    let x=F.x+(gx-4.5)*ts*(1+e*.45),y=F.y+(gy-4.5)*ts*(1+e*.45),s=ts-seam-e*8,rot=(j-.5)*e*.7*(1-E.outCubic(inv(13.2,14.4,t))),a=1,rad=4*sm;
    if(!isH){a=lerp(1,.3,inv(14.3,15,t));
      const st=17.8+j*1.3,p=E.inOutCubic(inv(st,st+1.5,t));
      if(p>0){const ang=hash(k*3.1)*7,rad2=Math.sqrt(hash(k*5.3))*240,sx=M.x+640+Math.cos(ang)*rad2,sy=M.y+Math.sin(ang)*rad2*.9+Math.sin(t*3+k)*5;
        x=lerp(x,sx,p);y=lerp(y,sy,p)-Math.sin(p*Math.PI)*320;s=lerp(s,22,p);a=lerp(a,1,p);rot+=p*Math.PI*2*(j>.5?1:-1)}
      a*=1-inv(28.6,29.6,t)}
    else{const p=E.inOutCubic(inv(19.4,21.6,t));x=lerp(x,M.x,p);y=lerp(y,M.y,p)-Math.sin(p*Math.PI)*280;rot*=1-p;
      if(t>=CH0){const s2=clamp(t-CH0,0,CHD);x=CX(s2);y=CY(price(s2))}}
    return {x,y,s,rot,a,col:C.red,rad};
  }
  const hp=heroPos(t),sc=heroScale(t),sq=squash(t),gp=t<47.4?0:inv(47.4,49,t);
  const ts=lerp(46,22,E.inOutCubic(inv(59.6,61.4,t)))*sc,gap=gp*2.4*(ts/46);
  let x=hp.x+(gx-4.5)*ts*(1+sq*.18),y=hp.y+(gy-4.5)*ts*(1-sq*.18)+sq*ts*.9,s=ts-gap,rot=0,a=1,col=C.red,stroke=null;
  if(FFi.has(k)){const i=FFi.get(k),t0=A(3)+i*.025,p=E.outBack(inv(t0,t0+.55,t))*(1-E.inOutCubic(inv(93.6+i*.02,94.4+i*.02,t)));
    if(p!==0){const tx=hp.x+(i%5-2)*ts*1.35,ty=hp.y-ts*5-45-(Math.floor(i/5))*ts*1.35+Math.sin(t*2.4+i)*5;x=lerp(x,tx,p);y=lerp(y,ty,p);stroke=p>.5?C.lime:null}}
  if(CHi.has(k)){const i=CHi.get(k),t0=111.15+i*.05;if(t>t0){const d=t-t0;x+=(hash(k)-.5)*500*d;y+=-300*d+2600*d*d;rot=(hash(k*2)-.5)*12*d;a=1-inv(.6,1.1,d)}}
  return {x,y,s,rot,a,col,stroke,rad:Math.min(4,s*.09)*gp,xray:t>=109.6&&t<111.0};
}
function drawTile(T){if(T.a<=0)return;c.save();c.translate(T.x,T.y);c.rotate(T.rot);c.globalAlpha*=T.a;
  rr(c,-T.s/2,-T.s/2,T.s,T.s,T.rad);
  if(T.xray){c.strokeStyle=C.red;c.lineWidth=1.5;c.stroke()}else{c.fillStyle=T.col;c.fill();if(T.stroke){c.strokeStyle=T.stroke;c.lineWidth=3;c.stroke()}}
  c.restore()}

/* ---------- focus = what the red thread follows ---------- */
let DOT={x:0,y:0,r:16};
function dotPos(t){const u=inv(5.6,7.1,t);return {x:lerp(DOT.x,F.x,E.outCubic(u)),y:lerp(DOT.y,F.y,E.outBounce(u))}}
function focus(t){if(t<8)return dotPos(t);if(t<40){const T=tileW(HI,t);return {x:T.x,y:T.y}}return heroPos(Math.min(t,117))}

/* ---------- camera ---------- */
const WHY_O=[[-230,-30,1.05,-.02],[230,-30,.95,.02],[-230,10,1.1,-.015],[230,0,.92,.02],[-200,-20,1.0,0]];
function wiesoCam(t){let x=HT_X,y=P.y-90,z=.9,r=0;
  WHY_O.forEach(([ox,oy,oz,orr],i)=>{const e=E.inOutCubic(inv(WHY_T(i)-.4,WHY_T(i)+.3,t));x=lerp(x,HT_X+ox,e);y=lerp(y,P.y-60+oy,e);z=lerp(z,oz,e);r=lerp(r,orr,e)});return {x,y,z,r}}
const SH=[
 [0,0,'io',t=>({x:0,y:0,z:1+t*.006})],
 [5.7,1.7,'io',t=>({x:0,y:F.y,z:1.04})],
 [8.0,0,'io',t=>({x:0,y:F.y,z:1.04+(t-8)*.012})],
 [14.2,1.4,'io',t=>{const p=tileW(HI,t);return {x:p.x+110,y:p.y+10,z:2.6}}],
 [17.9,2.6,'io',t=>({x:M.x,y:M.y-60,z:.8})],
 [26.8,1.5,'io',t=>{const s=clamp(t-.25-CH0,0,CHD),hy=CY(price(s));return {x:CX(s)+260,y:lerp(M.y,hy,.7)-40,z:1}}],
 [37.6,.9,'io',()=>({x:HEND.x,y:HEND.y-200,z:.85})],
 [39.0,1.0,'in',()=>({x:HEND.x,y:HEND.y,z:46})],
 [40.0,0,'io',t=>({x:P.x,y:P.y,z:5.2+(t-40)*.03})],
 [47.4,2.2,'iox',()=>({x:P.x,y:P.y-110,z:.95})],
 [53.4,1.8,'io',()=>({x:P.x,y:P.y-80,z:.55})],
 [59.4,1.8,'io',t=>({x:heroPos(t).x+300,y:P.y-230,z:.95})],
 [77.9,2.0,'io',()=>({x:(Gx(0)+Gx(5))/2,y:P.y-300,z:.36})],
 [81.3,1.5,'io',t=>({x:heroPos(t).x+330,y:P.y-200,z:.85})],
 [90.0,1.6,'io',()=>({x:HT_X,y:P.y-140,z:.62})],
 [93.8,1.2,'io',wiesoCam],
 [108,.7,'io',()=>({x:HT_X,y:P.y-40,z:1.1,r:0})],
 [115.0,1.7,'iox',()=>({x:7600,y:760,z:.112})],
];
function cam(t){let i=0;while(i+1<SH.length&&t>=SH[i+1][0])i++;
  const [t0,bl,ez,fn]=SH[i],b=fn(t);b.r=b.r||0;
  if(bl>0&&t<t0+bl&&i>0){const a=SH[i-1][3](t);a.r=a.r||0;let u=inv(t0,t0+bl,t);u=ez==='in'?E.inExpo(u):ez==='iox'?E.inOutExpo(u):E.inOutCubic(u);
    return {x:lerp(a.x,b.x,u),y:lerp(a.y,b.y,u),z:Math.exp(lerp(Math.log(a.z),Math.log(b.z),u)),r:lerp(a.r,b.r,u)}}
  return b}
let CAM={x:0,y:0,z:1,r:0};

/* ---------- text ---------- */
function setFont(ctx,sz,w=900,fam=DISP){ctx.font=`${w} ${sz}px "${fam}"`}
function fit(ctx,s,maxW,sz,w=900,fam=DISP){ctx.save();setFont(ctx,sz,w,fam);ctx.letterSpacing=(fam===DISP?-0.035*sz:0)+'px';const m=ctx.measureText(s).width;ctx.restore();return m>maxW?sz*maxW/m:sz}
function measure(ctx,s,sz,w=900,fam=DISP){ctx.save();setFont(ctx,sz,w,fam);ctx.letterSpacing=(fam===DISP?-0.035*sz:0.04*sz)+'px';const m=ctx.measureText(s).width;ctx.restore();return m}
function kt(ctx,s,x,y,sz,col,t,t0,op={}){
  const w=op.w??900,fam=op.fam??DISP,track=op.track??(fam===DISP?-0.035*sz:0.04*sz),st=op.st??0.028,d=op.d??0.7;
  if(t<t0)return;
  ctx.save();setFont(ctx,sz,w,fam);ctx.letterSpacing=track+'px';ctx.textBaseline='alphabetic';ctx.textAlign='left';
  const total=ctx.measureText(s).width,sx=op.align==='left'?x:op.align==='right'?x-total:x-total/2;
  if(op.mask!==false){ctx.beginPath();ctx.rect(sx-sz*.6,y-sz*1.02,total+sz*1.2,sz*1.36);ctx.clip()}
  const chars=[...s];let pre='';
  for(let i=0;i<chars.length;i++){const ch=chars[i],cx=sx+ctx.measureText(pre).width;pre+=ch;if(ch===' ')continue;
    const p=E.outExpo(inv(t0+i*st,t0+i*st+d,t));let q=0;if(op.out!=null)q=E.inExpo(inv(op.out+i*st*.6,op.out+i*st*.6+(op.od??.42),t));
    if(p<=0||q>=1)continue;const dy=(1-p)*sz*1.15-q*sz*1.2;
    ctx.fillStyle=typeof col==='function'?col(i,ch):col;ctx.globalAlpha=(op.a??1);
    if(op.noDot&&i===chars.length-1){ctx.save();ctx.beginPath();ctx.rect(cx-sz,y+dy-sz*2,sz*3,sz*2+QDOT.top*sz-2);ctx.clip();ctx.fillText(ch,cx,y+dy);ctx.restore()}
    else ctx.fillText(ch,cx,y+dy)}
  ctx.restore()}
const mono=(s,x,y,sz,col,t,t0,op={})=>kt(c,s,x,y,sz,col,t,t0,{fam:MONO,w:700,st:0.012,d:0.5,...op});
const mono2=(s,x,y,sz,col,t,t0,op={})=>kt(o,s,x,y,sz,col,t,t0,{fam:MONO,w:700,st:0.012,d:0.5,...op});
// geometry of the dot of "?" in Inter Display Black, relative to glyph origin, per 1px font size
let QDOT={cx:.3,cy:-.08,w:.15,top:-.15};
function measureQ(){const k=document.createElement('canvas');k.width=700;k.height=700;const g=k.getContext('2d');setFont(g,400,900);g.fillStyle='#fff';g.fillText('?',100,500);
  const d=g.getImageData(0,0,700,700).data,row=y=>{let mn=1e9,mx=-1;for(let x=0;x<700;x++)if(d[(y*700+x)*4+3]>128){mn=Math.min(mn,x);mx=Math.max(mx,x)}return [mn,mx]};
  let yb=699;while(yb>0&&row(yb)[1]<0)yb--;let yt=yb;while(yt>0&&row(yt-1)[1]>=0)yt--;let mn=1e9,mx=-1;for(let y=yt;y<=yb;y++){const [a,b]=row(y);mn=Math.min(mn,a);mx=Math.max(mx,b)}
  QDOT={cx:((mn+mx)/2-100)/400,cy:((yt+yb)/2-500)/400,w:(mx-mn)/400,top:(yt-500)/400};
  const qs=fit(c,'DIE BÖRSE?',1700,300),tw=measure(c,'DIE BÖRSE?',qs),pw=measure(c,'DIE BÖRSE',qs);
  DOT={x:-tw/2+pw+QDOT.cx*qs,y:150+QDOT.cy*qs,r:QDOT.w*qs/2,qs}}

/* ---------- shapes ---------- */
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,Math.max(0,Math.min(r,w/2,h/2)))}
function ring(ctx,x,y,r,p,col,lw,a0=-Math.PI/2){if(p<=0)return;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.beginPath();ctx.arc(x,y,r,a0,a0+Math.PI*2*p);ctx.stroke();ctx.restore()}
function check(ctx,x,y,s,p,col){if(p<=0)return;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=s*.16;ctx.lineCap='round';ctx.lineJoin='round';
  const q=[[-.38,.02],[-.1,.3],[.42,-.3]],L1=Math.hypot(.28,.28),L2=Math.hypot(.52,.6),L=(L1+L2)*p;ctx.beginPath();ctx.moveTo(x+q[0][0]*s,y+q[0][1]*s);
  if(L<=L1){const f=L/L1;ctx.lineTo(x+lerp(q[0][0],q[1][0],f)*s,y+lerp(q[0][1],q[1][1],f)*s)}else{ctx.lineTo(x+q[1][0]*s,y+q[1][1]*s);const f=(L-L1)/L2;ctx.lineTo(x+lerp(q[1][0],q[2][0],f)*s,y+lerp(q[1][1],q[2][1],f)*s)}
  ctx.stroke();ctx.restore()}
function burst(ctx,x,y,t,t0,col,n=28,R=320,seed=1){const a=t-t0;if(a<0||a>1.1)return;ctx.save();ctx.fillStyle=col;
  for(let i=0;i<n;i++){const ang=hash(i*3.1+seed)*Math.PI*2,sp=R*(0.5+hash(i*7.7+seed)*.7),p=E.outExpo(a/1.1),r=(1-p)*(4+hash(i+seed*9)*10);
    ctx.globalAlpha=1-p;ctx.beginPath();ctx.arc(x+Math.cos(ang)*sp*p,y+Math.sin(ang)*sp*p,r,0,7);ctx.fill()}ctx.restore()}
function shock(ctx,x,y,t,t0,col,R=600,lw=6){const a=t-t0;if(a<0||a>.9)return;const p=E.outExpo(a/.9);ctx.save();ctx.globalAlpha=1-p;ctx.strokeStyle=col;ctx.lineWidth=lw*(1-p)+1;ctx.beginPath();ctx.arc(x,y,R*p,0,7);ctx.stroke();ctx.restore()}
function cross(ctx,x,y,size,rot,col){const u=size/20;ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=col;ctx.fillRect(-3*u,-10*u,6*u,20*u);ctx.fillRect(-10*u,-3*u,20*u,6*u);ctx.restore()}
function coin(ctx,x,y,r,a=1){ctx.save();ctx.globalAlpha*=a;ctx.fillStyle=C.lime;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.strokeStyle='rgba(7,7,10,.5)';ctx.lineWidth=r*.18;ctx.beginPath();ctx.arc(x,y,r*.62,0,7);ctx.stroke();ctx.restore()}

/* ---------- world background (parallax) ---------- */
const DUST=[...Array(260)].map((_,i)=>({x:-3000+hash(i*1.1)*21000,y:-2500+hash(i*2.3)*6000,p:.25+hash(i*3.7)*.5,s:4+hash(i*4.1)*10,k:hash(i*5.9)}));
function worldBG(t){
  c.save();c.setTransform(1,0,0,1,0,0);c.fillStyle=C.bg;c.fillRect(0,0,W,H);
  const g=c.createRadialGradient(W/2,H*.55,0,W/2,H*.55,W*.75);g.addColorStop(0,'rgba(255,45,61,0.07)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,W,H);
  c.globalAlpha=.12;
  for(const d of DUST){const X=W/2+(d.x-CAM.x)*CAM.z*d.p,Y=H/2+(d.y-CAM.y)*CAM.z*d.p;
    if(X<-40||X>W+40||Y<-40||Y>H+40)continue;const s=Math.max(2,Math.min(40,d.s*CAM.z*d.p));
    if(d.k<.5){c.fillStyle=C.ink;c.fillRect(X-s/2,Y-s/2,s,s)}else{c.strokeStyle=C.ink;c.lineWidth=1.5;c.beginPath();c.moveTo(X-s,Y);c.lineTo(X+s,Y);c.moveTo(X,Y-s);c.lineTo(X,Y+s);c.stroke()}}
  c.restore();
}
function worldGrid(t){let sp=80;while(sp*CAM.z<38)sp*=4;const k=kick(t),r=(2.2+k*1.4)/CAM.z;
